<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            width: 50%;
            height: 150px;
            border: 1px solid black;
            padding: 10px;
        }

        .first {
            background-color: lightgreen;
        }

        .second {
            background-color: lightcoral;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <td class="first">First cell</td>
            <td class="second">Second cell</td>
        </tr>
    </table>
</body>
</html>
